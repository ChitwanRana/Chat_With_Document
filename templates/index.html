<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat With Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 800px; margin-top: 2rem; }
        .context-box { max-height: 300px; overflow-y: auto; margin-top: 1rem; }
        .loading { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Chat With Document</h1>
        
        <!-- Flash messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <!-- File upload form -->
        <div class="card mb-4">
            <div class="card-header">Upload Documents</div>
            <div class="card-body">
                <form action="{{ url_for('upload_files') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">Upload PDF files</label>
                        <input class="form-control" type="file" id="fileInput" name="files[]" multiple accept=".pdf">
                    </div>
                    <button type="submit" class="btn btn-primary">Process Documents</button>
                </form>
            </div>
        </div>
        
        <!-- Query form -->
        <div class="card mb-4">
            <div class="card-header">Ask Questions</div>
            <div class="card-body">
                <form id="queryForm">
                    <div class="mb-3">
                        <label for="queryInput" class="form-label">Enter your question</label>
                        <input type="text" class="form-control" id="queryInput" name="query" required>
                    </div>
                    <button type="submit" class="btn btn-success">Ask</button>
                    <div class="spinner-border text-primary loading mt-3" role="status" id="loadingSpinner">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Results -->
        <div id="results" style="display: none;">
            <div class="card mb-4">
                <div class="card-header">Answer</div>
                <div class="card-body">
                    <p id="answer"></p>
                    <small class="text-muted">Response time: <span id="responseTime"></span> seconds</small>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <button class="btn btn-link" type="button" data-bs-toggle="collapse" data-bs-target="#contextCollapse">
                        Document Context
                    </button>
                </div>
                <div id="contextCollapse" class="collapse">
                    <div class="card-body context-box" id="contextContent"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('queryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const query = document.getElementById('queryInput').value;
            const loadingSpinner = document.getElementById('loadingSpinner');
            const results = document.getElementById('results');
            
            loadingSpinner.style.display = 'inline-block';
            results.style.display = 'none';
            
            // Send query to backend
            fetch('/query', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'query': query
                })
            })
            .then(response => response.json())
            .then(data => {
                loadingSpinner.style.display = 'none';
                results.style.display = 'block';
                
                if (data.error) {
                    document.getElementById('answer').textContent = 'Error: ' + data.error;
                    return;
                }
                
                // Display results
                document.getElementById('answer').textContent = data.answer;
                document.getElementById('responseTime').textContent = data.response_time.toFixed(4);
                
                // Display context snippets
                const contextContent = document.getElementById('contextContent');
                contextContent.innerHTML = '';
                
                if (data.context_snippets && data.context_snippets.length > 0) {
                    data.context_snippets.forEach(snippet => {
                        const snippetDiv = document.createElement('div');
                        snippetDiv.className = 'mb-3 p-2 border-bottom';
                        snippetDiv.textContent = snippet;
                        contextContent.appendChild(snippetDiv);
                    });
                } else {
                    contextContent.textContent = 'No context snippets available.';
                }
            })
            .catch(error => {
                loadingSpinner.style.display = 'none';
                document.getElementById('answer').textContent = 'Error: ' + error.message;
                results.style.display = 'block';
            });
        });
    </script>
</body>
</html>
